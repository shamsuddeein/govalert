[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    -v
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (DB & multi-component pipeline)
    smoke: Production deployment smoke tests
asyncio_mode = auto
